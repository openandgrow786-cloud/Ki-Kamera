name: iPhone-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (unsigniert, Sideloadly signiert später)
        run: |
          xcodebuild -project KIKamera.xcodeproj -scheme KIKamera -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KIKamera.app Payload/
          zip -qry KIKamera.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KIKamera-ipa
          path: KIKamera.ipa
